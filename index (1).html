<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет выплат и лимитов</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            background: #fff;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            background-color: #f5f5f5;
            transition: background 0.2s;
            margin-bottom: 10px;
            text-align: center;
        }

        .btn:hover {
            background-color: #e8e8e8;
        }

        .btn-accent {
            background-color: #ffcc00;
            border-color: #e6b800;
            color: #000;
        }

        .btn-accent:hover {
            background-color: #e6b800;
        }

        .btn-danger {
            background-color: #fff0f0;
            color: #cc0000;
            border-color: #ffa0a0;
        }

        .btn-danger:hover {
            background-color: #ffe0e0;
        }

        .result-box {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #fafafa;
            border-left: 4px solid #ccc;
        }

        .result-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .scale-container {
            margin-top: 10px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            height: 20px;
            position: relative;
        }

        .scale-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }

        .scale-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            left: 0;
            font-size: 0.8rem;
            line-height: 20px;
            font-weight: bold;
            color: #000;
        }

        .status-green { background-color: #2ecc71; color: #fff; }
        .status-yellow { background-color: #f1c40f; color: #000; }
        .status-red { background-color: #e74c3c; color: #fff; }
        .status-neutral { background-color: #95a5a6; color: #fff; }

        .history-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            border: 1px solid #eee;
            padding: 5px;
            background: #fff;
        }

        .history-item {
            padding: 3px 0;
            border-bottom: 1px dashed #eee;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ЛЕВАЯ ЧАСТЬ: ВВОД ДАННЫХ -->
        <div class="section">
            <h2>Ввод данных</h2>
            
            <div class="form-group">
                <label>Выбрать Получателя</label>
                <select id="recipientSelect" onchange="switchRecipient()">
                    <option value="">-- Не выбрано --</option>
                </select>
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

            <div class="form-group">
                <label>ФИО Нового Получателя</label>
                <input type="text" id="newFio" placeholder="Иванов Иван Иванович">
            </div>
            <button class="btn btn-accent" onclick="addRecipient()">Добавить Получателя</button>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

            <div class="form-group">
                <label>Установить лимит (руб.)</label>
                <input type="number" id="limitInput" min="0" placeholder="Например, 50000">
            </div>
            <button class="btn" onclick="setLimit()">Лимит</button>

            <div class="form-group" style="margin-top: 20px;">
                <label>Сумма выплаты (руб.)</label>
                <input type="number" id="payoutInput" min="0" placeholder="Например, 5000">
            </div>
            <button class="btn" onclick="addPayout()">Выплата</button>
            
            <button class="btn btn-danger" style="margin-top: 20px;" onclick="resetRecipient()">Сбросить счёт</button>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ: ИТОГИ -->
        <div class="section">
            <h2>Итоговые поля</h2>
            
            <div id="infoBlock" style="margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; color: #333;">
                Получатель не выбран
            </div>

            <div class="result-box">
                <div class="result-title">Сумма выплат</div>
                <div class="result-value" id="totalPayouts">0.00 ₽</div>
            </div>

            <div class="result-box">
                <div class="result-title">Текущий лимит</div>
                <div class="result-value" id="currentLimit">Не установлен</div>
                
                <div id="scaleWrapper" style="display: none; margin-top: 15px;">
                    <div class="result-title">Использование лимита</div>
                    <div class="scale-container">
                        <div class="scale-bar" id="scaleBar"></div>
                        <div class="scale-text" id="scaleText">0%</div>
                    </div>
                </div>
            </div>

            <div class="result-box" id="warningBox" style="display: none; border-left-color: #e74c3c; background: #fdf2f2; color: #c0392b; font-weight: bold;">
                ⚠️ Внимание! Лимит исчерпан или превышен!
            </div>

            <div class="result-box">
                <div class="result-title">История операций по получателю</div>
                <div class="history-list" id="historyList">
                    <div style="color: #999; font-style: italic;">История пуста</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('recipient_limits_data')) || {
            recipients: {},
            currentId: ""
        };

        function saveData() {
            localStorage.setItem('recipient_limits_data', JSON.stringify(data));
        }

        function formatMoney(value) {
            return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' }).format(value);
        }

        function updateSelect() {
            const select = document.getElementById('recipientSelect');
            select.innerHTML = '<option value="">-- Выбрать Получателя --</option>';
            
            Object.keys(data.recipients).forEach(id => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = data.recipients[id].fio;
                if (id === data.currentId) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        function addRecipient() {
            const fioInput = document.getElementById('newFio');
            const fio = fioInput.value.trim();
            if (!fio) {
                alert('Пожалуйста, заполните ФИО получателя.');
                return;
            }

            const id = 'id_' + Date.now();
            data.recipients[id] = {
                fio: fio,
                limit: null,
                total: 0,
                history: []
            };
            data.currentId = id;
            fioInput.value = '';
            
            saveData();
            updateSelect();
            render();
        }

        function switchRecipient() {
            const select = document.getElementById('recipientSelect');
            data.currentId = select.value;
            saveData();
            render();
        }

        function setLimit() {
            if (!data.currentId) {
                alert('Сначала выберите или добавьте получателя.');
                return;
            }
            const limitInput = document.getElementById('limitInput');
            const val = parseFloat(limitInput.value);
            if (isNaN(val) || val < 0) {
                alert('Введите корректное число для лимита.');
                return;
            }

            const r = data.recipients[data.currentId];
            r.limit = val;
            r.history.push(`Установлен лимит: ${formatMoney(val)} (${new Date().toLocaleString('ru-RU')})`);
            
            limitInput.value = '';
            saveData();
            render();
        }

        function addPayout() {
            if (!data.currentId) {
                alert('Сначала выберите или добавьте получателя.');
                return;
            }
            const payoutInput = document.getElementById('payoutInput');
            const val = parseFloat(payoutInput.value);
            if (isNaN(val) || val <= 0) {
                alert('Введите корректную сумму выплаты.');
                return;
            }

            const r = data.recipients[data.currentId];
            r.total += val;
            r.history.push(`Выплата: +${formatMoney(val)} (${new Date().toLocaleString('ru-RU')})`);

            payoutInput.value = '';
            saveData();
            render();
        }

        function resetRecipient() {
            if (!data.currentId) return;
            if (!confirm('Вы уверены, что хотите обнулить счёт этого получателя? Лимит и история сохранятся.')) return;
            
            const r = data.recipients[data.currentId];
            r.total = 0;
            r.history.push(`Счёт обнулен (${new Date().toLocaleString('ru-RU')})`);
            
            saveData();
            render();
        }

        function render() {
            const infoBlock = document.getElementById('infoBlock');
            const totalPayouts = document.getElementById('totalPayouts');
            const currentLimit = document.getElementById('currentLimit');
            const scaleWrapper = document.getElementById('scaleWrapper');
            const scaleBar = document.getElementById('scaleBar');
            const scaleText = document.getElementById('scaleText');
            const warningBox = document.getElementById('warningBox');
            const historyList = document.getElementById('historyList');

            if (!data.currentId || !data.recipients[data.currentId]) {
                infoBlock.textContent = 'Получатель не выбран';
                totalPayouts.textContent = '0.00 ₽';
                currentLimit.textContent = 'Не установлен';
                scaleWrapper.style.display = 'none';
                warningBox.style.display = 'none';
                historyList.innerHTML = '<div style="color: #999; font-style: italic;">История пуста</div>';
                return;
            }

            const r = data.recipients[data.currentId];
            infoBlock.textContent = `Текущий получатель: ${r.fio}`;
            totalPayouts.textContent = formatMoney(r.total);

            // История
            if (r.history.length === 0) {
                historyList.innerHTML = '<div style="color: #999; font-style: italic;">История пуста</div>';
            } else {
                historyList.innerHTML = r.history.map(item => `<div class="history-item">${item}</div>`).reverse().join('');
            }

            // Лимит и шкала
            if (r.limit === null) {
                currentLimit.textContent = 'Не установлен';
                scaleWrapper.style.display = 'none';
                warningBox.style.display = 'none';
            } else {
                currentLimit.textContent = formatMoney(r.limit);
                scaleWrapper.style.display = 'block';

                let pct = r.limit > 0 ? (r.total / r.limit) * 100 : 0;
                let displayPct = pct.toFixed(1) + '%';
                
                scaleBar.style.width = Math.min(pct, 100) + '%';
                scaleText.textContent = displayPct;

                // Цветовая разметка
                scaleBar.className = 'scale-bar';
                if (pct <= 80) {
                    scaleBar.classList.add('status-green');
                } else if (pct > 90 && pct <= 99) {
                    scaleBar.classList.add('status-yellow');
                } else if (pct >= 100) {
                    scaleBar.classList.add('status-red');
                } else {
                    // Интервал от 80% до 90% и от 99% до 100% не описан жестко, сделаем нейтральным
                    scaleBar.classList.add('status-neutral');
                }

                // Предупреждение
                if (pct >= 100) {
                    warningBox.style.display = 'block';
                } else {
                    warningBox.style.display = 'none';
                }
            }
        }

        // Инициализация
        updateSelect();
        render();
    </script>
</body>
</html>
